<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Kerem Duel Tools — Settings</title>
<link rel="stylesheet" href="dt-settings.css"/>
</head>
<body>
  <div class="dt-topbar">
    <img class="dt-logo" src="icons/dt-tab-logo.gif" alt="Kerem Duel Tools"/>
    <div class="dt-brand">
      <div class="dt-brand-name">Kerem Duel Tools</div>
      <div class="dt-brand-sub">Extension Settings</div>
    </div>
    <div class="dt-topbar-spacer"></div>
    <div class="dt-theme-toggle" id="dt-theme-toggle">
      <span class="dt-dot"></span>
      <span id="dt-theme-label">Dark mode</span>
    </div>
  </div>
  <div class="dt-body">
    <div class="dt-sidebar" id="dt-sidebar"></div>
    <div class="dt-main" id="dt-main"></div>
  </div>
  <div class="dt-footer-bar">
    <button class="dt-footer-btn dt-footer-btn-danger" id="dt-reset-everything">Reset Everything</button>
    <div class="dt-footer-spacer"></div>
    <div class="dt-footer-status" id="dt-footer-status"></div>
    <button class="dt-footer-btn" id="dt-save">Save</button>
    <button class="dt-footer-btn dt-footer-btn-primary" id="dt-save-close">Save &amp; Close</button>
  </div>
  <script src="dt-settings.js"></script>
</body>
</html>
